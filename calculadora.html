<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        crossorigin="anonymous">
</head>

<body>
    <div class="container d-flex justify-content-center">
        <div class="col-12 col-sm-8 col-md-6 col-lg-5 mt-5 border border-1 p-3 rounded-3 shadow-lg">
            <h2 class="text-center mb-4">Ingrese los números</h2>
            <form action="" id="form">
                <div class="form-foating mb-2">
                    <input class="form-control" type="number" id="num1" placeholder="">
                    <Label>Primer Número</Label>
                </div>
                <div class="form-foating mb-2">
                    <input class="form-control" type="number" id="num2" placeholder="">
                    <Label>Segundo Número</Label>
                </div>
                <button class="btn btn-primary w-100 w-lg-uato">Calcular</button>
            </form>
            <div id="resultado"></div>
        </div>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
    <script src="matematicas.js"></script>
</body>

</html>
